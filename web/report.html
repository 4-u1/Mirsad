<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مِرصاد · تقرير القطاع</title>
<link rel="icon" href="emblem.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="styles.css" rel="stylesheet">
<style>
  /* تقرير القطاع الرسمي (PRD · U-FR9): يُطبع أو يُحفظ PDF من المتصفح */
  :root{--ink:#13242A;--brand:#13242A;--brand2:#113637;--teal:#257C83;--teal-l:#38C7B8;--gold:#B4742D;--paper:#FFFFFF;--soft:#F6F1E8;--rule:#E2D6C2;--mute:#4A5F66}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#E9E3D8;color:var(--ink);margin:0;padding-bottom:8px}
  .page{max-width:860px;margin:28px auto;background:var(--paper);box-shadow:0 18px 50px rgba(19,36,42,.16);border-radius:6px;overflow:hidden;position:relative}
  .hd{background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:22px 32px}
  .hd img{height:78px;width:auto;aspect-ratio:2000/790;display:block}.hd .logo-prn{display:none}
  .hd-meta{text-align:end;display:grid;gap:3px}
  .hd-meta b{font-size:19px;letter-spacing:.2px}
  .hd-meta span{font-size:12.5px;color:#B9CCD3}
  .hd-meta .ref{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:embed;color:var(--teal-l);font-size:13px}
  .stripe{height:5px;background:linear-gradient(90deg,var(--teal-l),var(--teal) 45%,var(--gold))}
  .body{padding:26px 32px 18px;display:grid;gap:20px}
  .title{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
  .title small{display:block;font-size:12.5px;color:var(--mute);font-weight:600;letter-spacing:.3px}
  .title h1{margin:2px 0 0;font-size:34px;font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:start;unicode-bidi:plaintext}
  .verdict{display:flex;align-items:center;gap:14px;border-radius:12px;padding:12px 18px;border:2px solid var(--lvc);background:var(--lvbg)}
  .verdict .num{font-size:44px;font-weight:700;line-height:1;color:var(--lvfg);font-variant-numeric:tabular-nums}
  .verdict .lv{display:grid;gap:2px}.verdict .lv b{font-size:18px;color:var(--lvfg)}.verdict .lv span{font-size:12px;color:var(--mute)}
  .scale{display:grid;gap:6px}
  .scale .track{position:relative;height:14px;border-radius:7px;display:flex;overflow:hidden;direction:ltr}
  .scale .track i{display:block;height:100%}
  .scale .pin{position:absolute;top:-6px;width:4px;height:26px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
  .scale .ticks{position:relative;height:16px;direction:ltr;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
  .scale .ticks span{position:absolute;top:0;transform:translateX(-50%)}.scale .ticks span:first-child{transform:none}.scale .ticks span:last-child{transform:translateX(-100%)}
  .scale .cap{font-size:12px;color:var(--mute)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .box{border:1px solid var(--rule);border-radius:10px;overflow:hidden}
  .box h2{margin:0;font-size:13.5px;font-weight:700;color:#fff;background:var(--brand2);padding:8px 14px;letter-spacing:.2px}
  .box .in{padding:6px 14px 10px}
  table.kv{width:100%;border-collapse:collapse;font-size:13.5px}
  table.kv td{padding:7px 0;border-bottom:1px dashed var(--rule)}
  table.kv tr:last-child td{border-bottom:0}
  table.kv td:last-child{text-align:end;font-weight:600;font-variant-numeric:tabular-nums}
  .shap{display:grid;grid-template-columns:96px 1fr 58px;gap:8px;align-items:center;font-size:13px;padding:5px 0}
  .shap .b{height:8px;background:var(--soft);border-radius:4px;position:relative;overflow:hidden}
  .shap .b i{position:absolute;top:0;bottom:0;inset-inline-start:0;border-radius:4px}
  .shap .v{text-align:end;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
  .stack{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:8px 0 6px;direction:ltr}
  .note{font-size:12px;color:var(--mute);line-height:1.7;margin:6px 0 0}
  .appr{border:1px solid var(--rule);border-radius:12px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:16px 20px;background:var(--soft);position:relative;min-height:150px}
  .appr h3{margin:0 0 6px;font-size:15px}
  .appr .st{display:inline-block;font-weight:700;font-size:13px;border-radius:999px;padding:3px 12px;margin-bottom:8px}
  .appr .sig{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
  .appr .sig dt{color:var(--mute)}.appr .sig dd{margin:0;font-weight:600}
  .stamp{width:168px;height:168px;transform:rotate(-11deg);opacity:.92;mix-blend-mode:multiply}
  .ft{border-top:1px solid var(--rule);padding:14px 32px 20px;display:grid;gap:6px;font-size:11.5px;color:var(--mute)}
  .ft .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .bar{max-width:860px;margin:0 auto;padding-bottom:40px !important;display:flex;gap:10px;justify-content:flex-end;padding:0 4px}
  @media (max-width:680px){.page{margin:0;border-radius:0}.hd{flex-direction:column;align-items:flex-start;padding:18px}.hd-meta{text-align:start}
    .body{padding:18px}.title,.grid,.appr{grid-template-columns:1fr}.stamp{justify-self:center}.ft{padding:14px 18px}.bar{padding:0 12px;flex-wrap:wrap}}
  @media print{@page{size:A4;margin:10mm}body{background:#fff}
    .hd{background:#fff !important;color:var(--ink) !important;border-bottom:2px solid var(--rule)}.hd .logo-scr{display:none}.hd .logo-prn{display:block}
    .hd .ref{color:var(--teal) !important}.hd-meta span{color:var(--mute) !important}.page{box-shadow:none;margin:0;max-width:none;border-radius:0}.bar{display:none}.box,.appr{break-inside:avoid}}
</style>
</head>
<body>
<main class="page" id="page"><div class="body"><p class="muted">…</p></div></main>
<div class="bar" id="bar"></div>
<script src="i18n.js"></script>
<script src="format.js"></script>
<script>
(function(){
  "use strict";
  let lang = "ar"; try { const v = localStorage.getItem("mirsad.lang"); lang = (v && v.replace(/"/g, "")) === "en" ? "en" : "ar"; } catch (e) {}

  const L = {
    ar: { title: "تقرير تقييم خطر القطاع", ref: "رقم المرجع", gen: "تاريخ الإصدار", model: "إصدار النموذج", sector: "القطاع", scale: "موقع الدرجة على سلّم المستويات",
      loc: "الإحداثيات (أعلى خلية خطرًا)", appr: "حالة الإنذار والاعتماد", by: "المعتمِد", at: "وقت القرار", alertNo: "رقم الإنذار",
      st_approved: "معتمد", st_pending: "بانتظار الاعتماد", st_dismissed: "مرفوض", st_none: "لا يتطلب إنذارًا",
      d_approved: "اعتمد مشغّل مخوّل هذا الإنذار، والقرار مسجّل في سجل التدقيق.", d_pending: "اقترح النظام إنذارًا لهذا القطاع، ولم يُعتمد بعد من مشغّل مخوّل.",

      d_offline: "يعمل التقرير بدون خادم؛ حالة الاعتماد من سجل هذا المتصفح.",
      stampTop: "نظام مِرصاد · اعتماد إنذار", stampMid: "معتمد", print: "طباعة / حفظ PDF", back: "العودة للخريطة", ge: "عرض في Google Earth",
      disc: "أداة دعم قرار أكاديمية. لا تغني عن الدراسة الميدانية ولا عن قرار الجهات الرسمية. أداء النموذج في التحقق المكاني ROC-AUC = ",
      sends: "الإرسال للجهات محاكى في هذه المرحلة.", foot: "مِرصاد · نظام التنبؤ بمخاطر الانهيارات الأرضية · القروب الثالث", missing: "قطاع غير موجود" },

  }

        <text x="100" y="118" text-anchor="middle" font-family="IBM Plex Sans Arabic, sans-serif" font-size="12" font-weight="600" fill="${c}">${who}</text>
        <text x="100" y="134" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="${c}">${when}</text>

  Promise.all([fetch("data/sectors.geojson").then((r) => r.json()), fetch("data/model.json").then((r) => r.json())]).then(async ([sec, m]) => {

    const ge = `https://earth.google.com/web/@${p.peak[0]},${p.peak[1]},${p.peak_vals.elevation}a,9000d,35y,0h,60t,0r`;
    const total = p.counts.reduce((a, b) => a + b, 0) || 1, shap = p.shap || {}, mx = Math.max(1e-6, ...Object.values(shap).map(Math.abs));

            el("p", { class: "note" }, t("shap_note")))),

            el("table", { class: "kv" }, ...LV.map((l, i) => row(`${SYM[l]} ${t("lv_" + l)}`, `${p.counts[i]} · ${Math.round(p.counts[i] / total * 100)}%`)),
              row(t("landcover"), lc(p.landcover)))))),
        hasLayers || fc ? el("div", { class: "grid" },
          hasLayers ? el("section", { class: "box" }, el("h2", {}, t("layers_title")), el("div", { class: "in" }, el("table", { class: "kv" },
            row(t("l_rain"), n1(p.rain_annual_mm, 0, " " + t("mm"))), row(t("l_rain99"), n1(p.rain_p99_3d_mm, 0, " " + t("mm"))),
            row(t("l_clay"), n1(p.soil_clay, 1, "%")), row(t("l_relief"), n1(p.relief_1km, 0, " " + t("m"))),
            row(t("l_lith"), p.lith_class ? t("lith_" + p.lith_class) : "—")))) : "",
          el("section", { class: "box" }, el("h2", {}, t("fc_title")), el("div", { class: "in" },
            fc ? el("table", { class: "kv" }, ...fc.horizons.map((h) => row(t("fc_h", { h: h.h }),
              `${n1(h.rain_mm, 1, " " + t("mm"))} · ${h.ratio == null ? "—" : Math.round(h.ratio * 100) + "%"} · ${SYM[h.level]} ${t("lv_" + h.level)}`))) : el("p", { class: "note" }, t("fc_none")),
            fc ? el("p", { class: "note" }, t("fc_issued", { t: dt(fc.issued_at).replace(/ \((الرياض|Riyadh)\)$/, "") }) + " · " + t("fc_note")) : ""))) : "",
        el("section", { class: "appr" },
          el("div", {}, el("h3", {}, L.appr),
            el("span", { class: "st", style: `background:${stCol[0]};color:${stCol[1]}` }, L["st_" + status]),
            el("p", { class: "note", style: "margin:0 0 8px" }, L["d_" + status] + (ap.live ? "" : (ap.status ? " " + L.d_offline : ""))),
