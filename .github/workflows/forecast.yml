name: Forecast 72h
# كل 6 ساعات: توقعات الأمطار لكل قطاع من Open-Meteo ← النسبة إلى عتبة CHIRPS ← المستوى المتوقع ← جدول forecasts (FR-U6)
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forecast
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check secret
        run: if [ -z "$DATABASE_URL" ]; then echo "::error::Missing repository secret DATABASE_URL"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pandas
      - run: python pipeline/10_forecast.py
