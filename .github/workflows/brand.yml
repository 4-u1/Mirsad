name: Brand logos
# يبني الشعار بلغتين ووضعين بخط الهوية Cairo (مسارات متجهة) ويعرض معاينة
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow fonttools uharfbuzz playwright && python -m playwright install --with-deps chromium
      - run: python pipeline/tools/build_logos.py
      - run: python pipeline/tools/preview_logos.py
      - run: python pipeline/tools/emit_b64.py brand out/brand
