name: TensorFlow comparison (FR-A3)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-pipeline.txt tensorflow-cpu
      - run: python pipeline/07_tensorflow_compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: tensorflow-comparison
          path: data/processed/tensorflow_comparison.json
