name: Rainfall climatology (CHIRPS)
# يجلب CHIRPS v2.0 اليومي 1991–2024 من NOAA ERDDAP ثم يحسب مناخ الأمطار والعتبات لكل خلية (FR-D1)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rain:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas xarray netCDF4 scipy
      - run: python pipeline/08_fetch_public_data.py rain_chunk 1991 2024
        env:
          MIRSAD_OUT: chunks
      - run: python pipeline/08_fetch_public_data.py rain_merge chunks
      - run: python pipeline/tools/emit_b64.py rain out
